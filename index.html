<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Augmented Cooking</title>
    <script>
      // No-FOUC: resolve the color scheme before first paint (mirrors
      // Mantine's ColorSchemeScript with defaultColorScheme="auto").
      try {
        var stored = window.localStorage.getItem('mantine-color-scheme-value');
        var scheme = stored === 'light' || stored === 'dark' || stored === 'auto' ? stored : 'auto';
        var resolved =
          scheme !== 'auto'
            ? scheme
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.setAttribute('data-mantine-color-scheme', resolved);
        document.documentElement.style.colorScheme = resolved;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
